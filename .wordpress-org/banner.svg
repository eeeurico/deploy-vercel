<svg xmlns="http://www.w3.org/2000/svg" width="1544" height="500" viewBox="0 0 1544 500">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#20262b"/><stop offset="1" stop-color="#111518"/></linearGradient>
    <radialGradient id="glow" cx="1230" cy="230" r="560" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#3858e9" stop-opacity="0.45"/><stop offset="0.6" stop-color="#3858e9" stop-opacity="0.08"/><stop offset="1" stop-color="#3858e9" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="28" stdDeviation="30" flood-color="#000" flood-opacity="0.5"/></filter>
    <clipPath id="frame"><rect width="1544" height="500"/></clipPath>
  </defs>
  <rect width="1544" height="500" fill="url(#bg)"/>
  <rect width="1544" height="500" fill="url(#glow)"/>

  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="88" y="196" font-size="84" font-weight="700" fill="#fff" letter-spacing="-2">Headless</text>
    <text x="88" y="286" font-size="84" font-weight="700" fill="#fff" letter-spacing="-2">Deploy Panel</text>
    <text x="92" y="346" font-size="40" fill="#8c8f94">for Vercel</text>
    <text x="92" y="414" font-size="31" fill="#c3c4c7">Deploy and revalidate from WordPress.</text>
  </g>

  <!-- panel, bleeding off the right edge -->
  <g clip-path="url(#frame)">
    <g filter="url(#shadow)"><rect x="820" y="64" width="800" height="380" rx="24" fill="#2a3035"/></g>
    <rect x="820" y="64" width="800" height="380" rx="24" fill="none" stroke="#3c434a" stroke-width="2"/>
    <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
      <text x="864" y="140" font-size="34" font-weight="700" fill="#fff">Deployments</text>
      <rect x="1300" y="102" width="168" height="60" rx="12" fill="#3858e9"/>
      <path d="M1334 144 V118 M1323 129 L1334 118 L1345 129" fill="none" stroke="#fff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="1360" y="142" font-size="27" font-weight="700" fill="#fff">Deploy</text>
      <line x1="820" y1="190" x2="1544" y2="190" stroke="#3c434a" stroke-width="2"/>

      <text x="864" y="266" font-size="29" fill="#fff">my-site</text>
      <rect x="1120" y="232" width="196" height="50" rx="25" fill="#72aee6" fill-opacity="0.18"/>
      <circle cx="1150" cy="257" r="9" fill="#72aee6"/>
      <circle cx="1150" cy="257" r="16" fill="none" stroke="#72aee6" stroke-opacity="0.35" stroke-width="4"/>
      <text x="1176" y="266" font-size="23" font-weight="700" fill="#72aee6" letter-spacing="1.5">BUILDING</text>
      <text x="1400" y="266" font-size="25" fill="#8c8f94">just now</text>

      <line x1="864" y1="316" x2="1544" y2="316" stroke="#3c434a" stroke-width="1.5"/>
      <text x="864" y="380" font-size="29" fill="#fff">my-site</text>
      <rect x="1120" y="346" width="150" height="50" rx="25" fill="#00ba37" fill-opacity="0.18"/>
      <circle cx="1150" cy="371" r="9" fill="#00ba37"/>
      <text x="1176" y="380" font-size="23" font-weight="700" fill="#00ba37" letter-spacing="1.5">READY</text>
      <text x="1400" y="380" font-size="25" fill="#8c8f94">2 h ago</text>
    </g>
  </g>

  <!-- revalidate toast, inside the frame -->
  <g filter="url(#shadow)"><rect x="700" y="404" width="332" height="68" rx="34" fill="#fff"/></g>
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <circle cx="740" cy="438" r="17" fill="#00ba37"/>
    <path d="M731 438 L737 444 L749 431" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="770" y="447" font-size="25" font-weight="700" fill="#1d2327">Revalidated /about/</text>
  </g>
</svg>
