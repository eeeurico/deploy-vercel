<svg xmlns="http://www.w3.org/2000/svg" width="1544" height="500" viewBox="0 0 1544 500">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0 H0 V40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>
  <rect width="1544" height="500" fill="#1d2327"/>
  <rect width="1544" height="500" fill="url(#grid)"/>

  <!-- title -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <text x="96" y="196" font-size="68" font-weight="700" fill="#ffffff" letter-spacing="-1.5">Headless Deploy Panel</text>
    <text x="96" y="262" font-size="42" font-weight="400" fill="#a7aaad">for Vercel</text>
    <text x="96" y="346" font-size="27" fill="#c3c4c7">Deploy, monitor and revalidate your headless</text>
    <text x="96" y="384" font-size="27" fill="#c3c4c7">front end without leaving WordPress.</text>
  </g>

  <!-- panel mockup -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <rect x="924" y="70" width="540" height="360" rx="20" fill="#2c3338"/>
    <text x="960" y="128" font-size="26" font-weight="700" fill="#ffffff">Deploy Panel</text>
    <rect x="1318" y="98" width="110" height="44" rx="8" fill="#3858e9"/>
    <path d="M1342 128 V112 M1335 119 L1342 112 L1349 119" fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="1358" y="127" font-size="19" font-weight="700" fill="#ffffff">Deploy</text>

    <line x1="924" y1="166" x2="1464" y2="166" stroke="#3c434a" stroke-width="2"/>

    <!-- rows -->
    <circle cx="968" cy="212" r="9" fill="#72aee6"/>
    <circle cx="968" cy="212" r="15" fill="none" stroke="#72aee6" stroke-opacity="0.35" stroke-width="4"/>
    <text x="994" y="219" font-size="21" fill="#ffffff">production</text>
    <text x="1180" y="219" font-size="18" font-weight="700" fill="#72aee6" letter-spacing="1">BUILDING</text>
    <text x="1428" y="219" font-size="18" fill="#a7aaad" text-anchor="end">just now</text>

    <line x1="952" y1="250" x2="1436" y2="250" stroke="#3c434a" stroke-width="1"/>
    <circle cx="968" cy="290" r="9" fill="#00a32a"/>
    <text x="994" y="297" font-size="21" fill="#ffffff">production</text>
    <text x="1180" y="297" font-size="18" font-weight="700" fill="#00a32a" letter-spacing="1">READY</text>
    <text x="1428" y="297" font-size="18" fill="#a7aaad" text-anchor="end">2 h ago</text>

    <line x1="952" y1="328" x2="1436" y2="328" stroke="#3c434a" stroke-width="1"/>
    <circle cx="968" cy="368" r="9" fill="#00a32a"/>
    <text x="994" y="375" font-size="21" fill="#ffffff">production</text>
    <text x="1180" y="375" font-size="18" font-weight="700" fill="#00a32a" letter-spacing="1">READY</text>
    <text x="1428" y="375" font-size="18" fill="#a7aaad" text-anchor="end">yesterday</text>
  </g>

  <!-- revalidate chip, overlapping the panel's bottom edge -->
  <g font-family="Helvetica Neue, Helvetica, Arial, sans-serif">
    <rect x="868" y="404" width="232" height="54" rx="27" fill="#ffffff"/>
    <path d="M902 431 a10 10 0 1 1 3 7" fill="none" stroke="#1d2327" stroke-width="3" stroke-linecap="round"/>
    <path d="M898 437 L905 439 L907 432" fill="none" stroke="#1d2327" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="928" y="438" font-size="19" font-weight="700" fill="#1d2327">Revalidate page</text>
  </g>
</svg>
